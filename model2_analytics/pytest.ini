[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:geoalchemy2.*
    # See model1-registry/pytest.ini for why these two are silenced here
    # too -- same starlette/anyio TestClient internals, reused by
    # tests/conftest.py to test model2's endpoints via the same app.
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*anyio.abc.BlockingPortal.*:DeprecationWarning:starlette.testclient
