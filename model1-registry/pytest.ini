[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:geoalchemy2.*
    # starlette's TestClient still uses httpx (not the new, pre-1.0 `httpx2`
    # replacement) - this is a heads-up for a future starlette major version,
    # not something wrong today. Revisit once httpx2 is a stable, normal
    # dependency to add; not worth pulling in an early-stage package for a
    # deprecation warning that doesn't affect current behavior.
    ignore::starlette.exceptions.StarletteDeprecationWarning
    # anyio.abc.BlockingPortal is deprecated in favor of
    # anyio.from_thread.BlockingPortal - this warning fires from inside
    # starlette's own testclient.py at import time (an upstream annotation,
    # not anything we call), so there's no line of our own to fix.
    ignore:.*anyio.abc.BlockingPortal.*:DeprecationWarning:starlette.testclient
