# AuditReport1.md finding 16: no CI existed at all - every merge into
# main was going in with whatever the last person happened to run
# locally, if anything. This runs the real model1-registry test suite
# (tests/conftest.py's own real-Postgres-not-sqlite design, see its
# docstring) on every push and pull request touching main.
#
# AuditReport2.md finding 6 added a second job that runs
# model2_analytics/tests/ the same way: its conftest.py re-exports
# model1-registry's own DB/app fixtures (model2's routers are mounted
# into model1's app object at runtime, so there's one app and one DB to
# test against, not two) -- see that conftest.py's docstring for why.
#
# Postgres + PostGIS + pgvector are installed directly on the runner via
# apt rather than as a GitHub Actions "services:" container, because the
# project doesn't publish a prebuilt image with all three - only
# infra/Dockerfile.db does, as a local build step - and matches the
# approach AuditReport1.md's own Section 6 confirmed works ("postgresql-
# 16-postgis-3 3.4.2 and postgresql-16-pgvector 0.6.0 are both available
# via plain Ubuntu apt"). scripts/bootstrap_local_db.sh then creates the
# 'sentinel' role/database exactly as it would for a local contributor -
# each suite's own conftest.py handles 'sentinel_test' itself, per session.
#
# actions/setup-python's built-in `cache: pip` caches pip's download/wheel
# cache (not the venv itself) keyed on a hash of `cache-dependency-path` -
# a hit skips re-downloading/re-building every wheel (torch-adjacent
# packages aren't pulled in here, but psycopg2-binary, shapely, and
# opencv-python-headless all have real build/extraction cost) and only
# changes when the relevant requirements*.txt actually changes.
# model2_analytics's requirements-dev.txt pulls in model1-registry's
# requirements.txt too (`-r ../model1-registry/requirements.txt`, see
# that file's own docstring on why the two must stay version-aligned),
# so its cache key covers both paths for the same reason.
name: sentinel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  model1-registry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model1-registry/requirements*.txt

      - name: Install PostgreSQL 16 + PostGIS + pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector
          sudo systemctl start postgresql

      - name: Bootstrap the local 'sentinel' role/database
        run: bash scripts/bootstrap_local_db.sh

      - name: Install Python dependencies
        working-directory: model1-registry
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: model1-registry
        run: pytest

  model2_analytics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            model2_analytics/requirements*.txt
            model1-registry/requirements.txt

      - name: Install PostgreSQL 16 + PostGIS + pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector
          sudo systemctl start postgresql

      - name: Bootstrap the local 'sentinel' role/database
        run: bash scripts/bootstrap_local_db.sh

      - name: Install Python dependencies
        working-directory: model2_analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: model2_analytics
        run: pytest
