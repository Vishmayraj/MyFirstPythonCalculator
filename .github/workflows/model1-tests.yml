# AuditReport1.md finding 16: no CI existed at all - every merge into
# main was going in with whatever the last person happened to run
# locally, if anything. This runs the real model1-registry test suite
# (tests/conftest.py's own real-Postgres-not-sqlite design, see its
# docstring) on every push and pull request touching main.
#
# Postgres + PostGIS + pgvector are installed directly on the runner via
# apt rather than as a GitHub Actions "services:" container, because the
# project doesn't publish a prebuilt image with all three - only
# infra/Dockerfile.db does, as a local build step - and matches the
# approach AuditReport1.md's own Section 6 confirmed works ("postgresql-
# 16-postgis-3 3.4.2 and postgresql-16-pgvector 0.6.0 are both available
# via plain Ubuntu apt"). scripts/bootstrap_local_db.sh then creates the
# 'sentinel' role/database exactly as it would for a local contributor -
# tests/conftest.py handles 'sentinel_test' itself, every session.
name: model1-registry tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16 + PostGIS + pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector
          sudo systemctl start postgresql

      - name: Bootstrap the local 'sentinel' role/database
        run: bash scripts/bootstrap_local_db.sh

      - name: Install Python dependencies
        working-directory: model1-registry
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: model1-registry
        run: pytest
