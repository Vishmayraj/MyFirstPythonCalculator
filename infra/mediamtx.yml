# MediaMTX config for Sentinel
logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
protocols: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcAdditionalHosts: [127.0.0.1, localhost]

hls: yes
hlsAddress: :8888
hlsSegmentDuration: 2s
# CORS origins restricted to the Sentinel UI, to prevent unauthorized
# embedding. Hardcoding 'localhost:8000' here breaks HLS/WebRTC playback
# with a CORS error the moment this is deployed to a real domain
# (AuditReport1.md finding 11 / 3.2), so both values are overridden via the
# MTX_HLSALLOWORIGIN / MTX_WEBRTCALLOWORIGIN environment variables that
# infra/docker-compose.yml sets on the `mediamtx` service (both driven off
# a single MEDIAMTX_CORS_ORIGIN env var - see .env.example). MediaMTX reads
# env vars named MTX_<UPPERCASE_KEY> as overrides for any config.json/.yml
# key, so these two literals are only the local-dev fallback for anyone
# running `mediamtx mediamtx.yml` directly, outside docker-compose.
hlsAllowOrigin: 'http://localhost:8000'
webrtcAllowOrigin: 'http://localhost:8000'

# NOTE: there is deliberately no `paths:` block of static camNN entries
# here anymore (AuditReport1.md finding 10 / 3.1). This file used to ship
# 30 hardcoded `camNN: source: rtsp://103.250.160.189:8554/...` entries,
# one per government-grid camera, which both (a) duplicated the grid IP
# that already lives in model1-registry/app/config.py's GRID_RTSP_HOST and
# model2-analytics/app/ingestion/catalogue.py's fallback, and (b)
# contradicted this repo's own documented architecture: per this file's
# own infra/README.md ("Dynamic Stream Registration" section) and
# model1-registry/app/main.py's `_sync_cameras()`, camera streams are
# registered at runtime by the `IngestionSupervisor` via the MediaMTX API
# (`POST /v3/config/paths/add/<id>`), not declared statically here - so the
# static entries were dead config left over from an earlier approach, not
# a real fallback. If a stream ever needs to be registered by hand for
# local testing, use the `curl` example in infra/README.md instead.
